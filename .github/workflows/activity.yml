name: Refresh profile activity

on:
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Update activity images
        run: python3 scripts/update_activity.py
      - name: Save changed images
        run: |
          git add assets/activity-light.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh GitHub contribution activity'
          git push
